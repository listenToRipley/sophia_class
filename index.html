<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Content Page</title>
    </head>
    <body>
        <a href="#main-content">Skip</a>
        <header>
            <h1>Activities</h1>
            <p>Info outline</p>
            <nav aria-label="Primary">
                <ul>
                    <li><a aria-current="page" href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>
        <main id="main-content">
            <section>
                <h2>HOME MAIN</h2>
                <figure>
                    <img src="images/mountain-sunrise.jpg"
                    alt="Sun rising behind snow-covered mountains with orange and pink sky"
                    width="600"
                    height="400">
                <figcaption>Sunrise over the Rocky Mountains during early morning light.</figcaption>
                </figure>
                <img src="images/decorative-divider.png"
                    alt=""
                    width="600"
                    height="100">
            </section>
            <section id="videos">
                <!-- video -->
                <video controls width="640" height="360">
                    <source src="media/videos/sophia_intro.mp4" type="video/mp4">
                    <source src="media/videos/sophia_intro.webm" type="video/webm">
                    <track
                    src="media/sophia_intro_caption.vtt"
                    kind="captions"
                    srclang="en"
                    label="English"
                    default>
                    <p>Your browser cannot play this video.</p>
                    <p><a href="media/sophia_intro.vtt">Download the video</a> to watch.</p>
                </video>
                <!-- iframe -->
                <br>
                <iframe 
                    width="560" 
                    height="315" 
                    src="https://www.youtube.com/embed/iTcO_fvsVkI?si=LaCzxEddpiZs8uGH" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; 
                            autoplay; 
                            clipboard-write; 
                            encrypted-media; 
                            gyroscope; 
                            picture-in-picture; 
                            web-share" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
                </iframe>
            </section>
            <section>
                <audio
                    src="media/audio/nature-sounds.mp3"
                    controls
                    loop
                    muted>
                    Your browser cannot play this audio.
                </audio>
            </section>
            <section id="form">
                <form action="/contact" method="post">

                    <fieldset>
                        <legend>Contact Information</legend>                    
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name"
                        required minlength="2" maxlength="50">                  
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>                 
                        <label for="phone">Phone :</label>
                        <input type="tel" id="phone" name="phone"
                            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                            title="Enter phone as 123-456-7890">
                    </fieldset>  
                    <fieldset>
                        <label for="subject">Subject
                        <input id="subject" type="text" name="subject"></label>               
                        <label for="message">Message</label>
                        <textarea id="message" name="message"
                            required minlength="20" maxlength="1000">
                        </textarea>                    
                        <button type="submit">Send</button>
                    </fieldset>
                    <fieldset>
                        <legend>Contact Preferences</legend>
                        <label for="contactEmail">Email Address:</label>
                        <input type="email" id="contactEmail" name="contactEmail">
                        <br>
                        <label for="contactPhone">Phone Number:</label>
                        <input type="tel" id="contactPhone" name="contactPhone">
                        <br>
                        <p>Preferred Method:</p>
                        <!-- radio buttons -->
                        <label>
                        <input type="radio" name="contactMethod" value="email"> Email
                        </label>
                        <label>
                        <input type="radio" name="contactMethod" value="phone"> Phone
                        </label>
                        <label>
                        <input type="radio" name="contactMethod" value="text"> Text
                        </label>
                        <br>
                        <label for="preferredTime">Best Time to Call:</label>
                        <select id="preferredTime" name="preferredTime">
                        <option value="morning">Morning</option>
                        <option value="afternoon">Afternoon</option>
                        <option value="evening">Evening</option>
                        </select>
                    </fieldset>

                    <fieldset>
                        <legend>Account Settings</legend>
                        <fieldset>
                        <legend>Login Credentials</legend>
                        <label for="accountEmail">Email:</label>
                        <input type="email" id="accountEmail" name="accountEmail" required>
                        <br>
                        <label for="accountPassword">Password:</label>
                        <input type="password" id="accountPassword" name="accountPassword" required>
                    </fieldset>
                    <fieldset>
                        <legend>Security Questions</legend>
                        <label for="question1">Security Question 1:</label>
                        <select id="question1" name="question1">
                        <option value="">Select a question</option>
                        <option value="pet">What was your first pet's name?</option>
                        <option value="city">What city were you born in?</option>
                        </select>
                        <br>
                        <label for="answer1">Answer:</label>
                        <input type="text" id="answer1" name="answer1">
                        </fieldset>
                    </fieldset>
                </form>
            </section>
        </main>
        <footer aria-label="Footer">
            <p>&copy; 2026 Our Website</p>
        </footer>
    </body>
</html>
